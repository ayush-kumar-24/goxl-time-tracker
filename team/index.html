<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoXL Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: forest sidebar, cream workspace, lime used only for the primary action and the active nav item (GoXL brand guide). */
:root{
  --forest:#1B4332; --forest-deep:#0F2A1E; --forest-mid:#295843; --lime:#C8E600; --lime-dim:#A8C200;
  --bg:#F4F5F1; --panel:#FDFDFB; --ink:#26312B; --muted:#5E6B64; --line:#E1E6E0; --soft:#ECEFE9;
  --accent:#1B4332; --accent-ink:#F6F7F3; --accent-soft:#E3ECDC;
  --good:#2E7D4F; --warn:#C9861C; --bad:#C4443A; --good-soft:#E0F0E5; --warn-soft:#FAEEDA; --bad-soft:#F9E3E0;
  --c1:#1B4332; --c2:#C9861C; --c3:#6D4C9F; --c4:#2F6690; --c5:#B5446E; --c6:#5F7A00; --c7:#5B6B63;
  --display:"Montserrat",system-ui,sans-serif; --body:"Montserrat",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:6px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--body);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.app{display:grid;grid-template-columns:224px 1fr;height:100%}
.side{background:var(--forest-deep);color:var(--bg);display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow:auto;border-right:3px solid var(--lime)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:4px 8px 18px}
.brand img{display:block;height:36px;width:auto}
.brand span{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(246,247,243,.6);padding-left:3px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:8px 10px;cursor:pointer;color:rgba(246,247,243,.74);font-weight:500;font-size:13px}
.nav:hover{background:rgba(255,255,255,.07);color:var(--bg)}
.nav[aria-current="page"]{background:rgba(200,230,0,.12);color:var(--lime);box-shadow:inset 3px 0 0 var(--lime)}
.nav .n{font-size:10.5px;font-weight:600;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.side :focus-visible{outline-color:var(--lime)}
.me{margin-top:auto;border-top:1px solid rgba(246,247,243,.15);padding:12px 8px 0;display:flex;flex-direction:column;gap:8px}
.me .row{display:flex;align-items:center;gap:8px}
.me small{color:rgba(246,247,243,.6);display:block;font-size:11px;line-height:1.35}
.me b{color:var(--bg)}
.me .btn{background:transparent;color:var(--bg);border-color:rgba(246,247,243,.3)}
.me .btn:hover{background:rgba(255,255,255,.08)}
.wrap{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 28px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.005em;margin-right:auto}
.top label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:5px 12px;background:var(--soft);font-size:12px;color:var(--muted)}
.pill.run{background:var(--accent-soft);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.run .dot{background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.run .dot{animation:none}}
main{padding:24px 28px 48px;overflow:auto;flex:1}
.lead{color:var(--muted);margin:0 0 18px;max-width:72ch}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--forest-mid);margin-bottom:6px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-family:var(--body);font-size:13.5px;font-weight:600;letter-spacing:0;color:var(--forest);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0;text-transform:none}
.stack>.card+.card{margin-top:16px}
.kpi b{display:block;font-size:22px;font-weight:500;font-family:var(--mono);color:var(--forest-deep);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px;font-weight:400}
.kpi.bad b{color:var(--bad)}
.muted{color:var(--muted)}
b,strong{font-weight:600}
.signin .card h2{font-family:var(--display);font-size:16px;color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 13px;cursor:pointer;font-weight:600;font-size:12.5px;line-height:1.3}
.btn:hover{border-color:var(--forest-mid)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--forest-deep)}
.btn.pri:hover{background:var(--lime-dim);border-color:var(--lime-dim)}
.btn.dark{background:var(--forest);border-color:var(--forest);color:var(--bg)}
.btn.sm{padding:4px 9px;font-size:11.5px}
/* Timer controls: larger targets, easy to hit */
.btn.start{padding:10px 18px;font-size:13.5px;min-height:40px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.start::before{content:"";width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.btn.start.pause::before{width:3px;height:11px;border:0;border-left:3px solid currentColor;border-right:3px solid currentColor;box-sizing:content-box}
.btn.start[disabled]::before{opacity:.6}
.tcard:focus-visible,.docrow:focus-visible{outline:2px solid var(--forest-mid);outline-offset:1px}
.li .btn.start{min-width:104px;justify-content:center}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--forest-mid);outline-offset:2px}
select,input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],textarea{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px;min-width:0}
select:focus,input:focus,textarea:focus{border-color:var(--forest-mid);outline:none;box-shadow:0 0 0 3px rgba(41,88,67,.14)}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--forest)}
.av{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:var(--r);background:var(--soft);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--forest)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .sp{margin-left:auto}
.toolbar label{font-size:12px;font-weight:500}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.col h3{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--forest);display:flex;justify-content:space-between;padding:2px 4px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.tcard:hover{border-color:var(--forest-mid)}
.tcard.blocked{border-left:3px solid var(--bad)}
.tcard.doing{border-left:3px solid var(--forest)}
.tcard b{font-weight:600;line-height:1.35}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow>div:first-child{overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--forest-mid)}
td.r,th.r{text-align:right}
td.wrapc{white-space:normal;min-width:160px;max-width:240px}
.rowbad td{background:var(--bad-soft)}
.chart{display:flex;align-items:flex-end;gap:18px;height:190px;padding:8px 4px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.chart .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .stack{width:100%;max-width:56px;display:flex;flex-direction:column-reverse;border-radius:2px 2px 0 0;overflow:hidden}
.chart .v{font-size:11px;font-weight:600;font-family:var(--mono)}
.xl{display:flex;gap:18px;padding:6px 4px;color:var(--muted);font-size:12px}
.xl span{flex:1;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.docs{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px 28px;min-height:320px}
.paper h2{font-size:17px;margin-bottom:4px;letter-spacing:-.005em;text-transform:none;color:var(--ink);font-weight:700}
.paper p{max-width:65ch;margin:12px 0}
.paper ul{padding-left:20px;max-width:65ch}
.docrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:left}
.docrow:hover{background:var(--soft)}
.docrow[aria-current="true"]{background:var(--accent-soft);border-color:var(--forest-mid)}
.ext{flex:none;width:34px;height:40px;border-radius:var(--r);background:var(--soft);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted)}
.chat{display:grid;grid-template-columns:200px 1fr;gap:16px;height:calc(100% - 4px);min-height:420px}
.chans{display:flex;flex-direction:column;gap:2px}
.chans button{text-align:left;background:none;border:0;border-radius:var(--r);padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.chans button[aria-current="true"]{background:var(--accent-soft);color:var(--forest);font-weight:600}
.chans button:hover{background:var(--soft)}
.room{display:flex;flex-direction:column;min-height:0;padding:0}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px}
.msg .t{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;font-family:var(--mono)}
.msg p{margin:2px 0 0;max-width:70ch;overflow-wrap:anywhere}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.compose input{flex:1}
.shade{position:fixed;inset:0;background:rgba(15,42,30,.5);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--panel);padding:20px;overflow:auto;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.drawer h2{font-family:var(--display);font-size:16px;text-transform:none;letter-spacing:-.005em;color:var(--ink);font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.field select,.field input{color:var(--ink);font-size:13px;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-family:var(--body);font-size:12.5px;font-weight:600;color:var(--forest)}
.signin{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;padding:16px;overflow:auto}
.signin .card{width:min(440px,100%);display:flex;flex-direction:column;gap:12px}
.signin button.who{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 12px;cursor:pointer;text-align:left}
.signin button.who:hover{border-color:var(--forest-mid)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--forest-deep);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:60;font-weight:500;max-width:90vw;border-bottom:2px solid var(--lime)}
.note{font-size:12px;color:var(--muted);margin-top:16px}
/* Work Intelligence Engine screens */
.health{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);font-weight:600;margin-bottom:16px;border-left:4px solid}
.health.Green{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.health.Attention{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.health.Critical{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--panel);padding:14px 16px}
.stat .num{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--forest-deep)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.alert-row{padding:10px 12px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);margin-bottom:8px;font-size:13px}
.alert-row.high{border-color:var(--bad);background:var(--bad-soft)}
.alert-row b{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.sum-list{margin:6px 0 0;padding-left:18px}
.sum-list li{margin-bottom:4px}
.fgrid{display:grid;gap:14px;margin-bottom:14px}
.fg2{grid-template-columns:1fr 1fr}.fg4{grid-template-columns:repeat(4,1fr)}
.fgrid label,.flabel{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px}
.fgrid input,.fgrid select{width:100%}
.etable td{padding:6px;vertical-align:middle}
.etable input,.etable select{border-color:transparent;background:transparent;padding:7px 8px;font-size:13px;width:100%}
.etable input:hover,.etable select:hover{border-color:var(--line)}
.etable input:focus,.etable select:focus{background:var(--panel);border-color:var(--forest-mid)}
.etable .blockrow td{padding:0 6px 10px}
.blockpanel{padding:14px 16px;background:var(--bad-soft);border:1px dashed rgba(196,68,58,.4);border-radius:var(--r)}
.rm{background:none;border:0;color:var(--bad);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:var(--r)}
.rm:hover{background:var(--bad-soft)}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:3px solid var(--lime);align-items:center}
  .brand,.me{display:none}
  .nav{width:auto;white-space:nowrap}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.fg2{grid-template-columns:1fr}
  .fg4{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .docs,.chat{grid-template-columns:1fr}
  .chat{height:auto}.room{height:460px}
  .chans{flex-direction:row;overflow-x:auto}
  .top,main{padding-left:16px;padding-right:16px}
}
@media (max-width:480px){.g4,.g3,.fg4{grid-template-columns:1fr}.chart,.xl{gap:8px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="wrap">
    <header class="top" id="top"></header>
    <main id="main"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toast"></div>

<script src="/team/config.js"></script>

  ],
  entries:[],

function parseCSV(t){
  const rows=[]; let r=[], c='', q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ c+='"'; i++; } else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ r.push(c); c=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; r.push(c); c=''; rows.push(r); r=[]; }
    else c+=ch; }
  if(c!==''||r.length){ r.push(c); rows.push(r); }
  return rows.filter(x=>x.some(v=>v.trim()!==''));
}
function checkSheet(text){
  const rows=parseCSV(text);
  if(rows.length<2) return {err:'Add a header row and at least one task row.'};
  const head=rows[0].map(x=>x.trim().toLowerCase().replace(/[^a-z]/g,''));
  const ix=list=>head.findIndex(x=>list.includes(x));
  const iT=ix(['title','task','name']), iP=ix(['project']), iA=ix(['assignee','owner','assignedto']), iPr=ix(['priority']), iE=ix(['estimate','est','hours']), iD=ix(['due','duedate','deadline']), iDp=ix(['dependson','dependencies','depends']);
  if(iT<0||iP<0) return {err:'The header row needs at least "title" and "project" columns.'};
  const own=rows.slice(1).map(r=>(r[iT]||'').trim().toLowerCase());
  const known=S.tasks.map(t=>t.title.toLowerCase());
  const PM={'':'medium',urgent:'urgent',p1:'urgent',high:'high',p2:'high',medium:'medium',p3:'medium',low:'low',p4:'low'};
  return {rows:rows.slice(1).map((r,i)=>{
    const g=k=>k<0?'':(r[k]||'').trim(), errs=[];
    const title=g(iT); if(!title) errs.push('Title is missing');
    const pv=g(iP).toLowerCase(), proj=projects.find(p=>p.id===pv||p.name.toLowerCase()===pv);
    if(!proj) errs.push('Unknown project'); else if(!visIds().includes(proj.id)) errs.push('You have no access to '+proj.name);
    const an=g(iA).toLowerCase(), m=activeMembers().find(x=>x.name.toLowerCase()===an||x.name.split(' ')[0].toLowerCase()===an);
    if(!an) errs.push('Assignee is missing'); else if(!m) errs.push('Unknown or inactive assignee'); else if(proj&&!visIds(m.id).includes(proj.id)) errs.push(m.name+' has no access to this project');
    const prKey=g(iPr).toLowerCase(), pr=PM[prKey]||null; if(!pr) errs.push('Priority must be Urgent, High, Medium or Low');
    const ev=g(iE), est=ev===''?4:parseFloat(ev); if(!(est>0)) errs.push('Estimate must be a number of hours');
    const due=g(iD); if(due&&!/^\d{4}-\d{2}-\d{2}$/.test(due)) errs.push('Due date must look like 2026-11-30');
    const depTitles=g(iDp).split(';').map(x=>x.trim()).filter(Boolean);
    depTitles.forEach(d=>{ if(!own.includes(d.toLowerCase())&&!known.includes(d.toLowerCase())) errs.push('Unknown dependency: '+d); });
    return {n:i+2,title,proj,m,pr,est:est>0?est:0,due,depTitles,errs};
  })};
}

}

/* ---------- Projects and document upload ---------- */
function addDocFile(f, pid){
  const add=body=>{ const d={id:'d'+(++S.seq),name:f.name,type:(f.name.split('.').pop()||'file'),project:pid,owner:S.user,upd:'Just now',body}; S.docs.unshift(d); S.docSel=d.id; toast('Uploaded '+f.name+' to '+PR(pid).name+'.'); render(); };
  if(/\.(txt|md|csv)$/i.test(f.name)){ const r=new FileReader(); r.onload=()=>add(String(r.result).slice(0,4000)); r.onerror=()=>add('This file could not be read.'); r.readAsText(f); }
  else add('Preview is not available for this file type in the prototype. The file would open in a viewer in the real platform.');
}
function createProject(){
  if(!can('addProject')) return toast('Your role cannot create projects.');
  const name=$('#npName').value.trim();
  if(!name) return toast('Give the project a name.');
  if(projects.some(p=>p.name.toLowerCase()===name.toLowerCase())) return toast('A project with that name already exists.');
  const id='p'+(++S.seq), me=P(S.user);
  projects.push({id,name,lead:null,desc:$('#npDesc').value.trim(),c:'var(--c'+((projects.length%7)+1)+')'});
  if(!['super_admin','founder'].includes(me.rk)) me.acc.push(id);
  S.channels.push([id,name,id]);
  audit('Created project '+name);
  const files=S.npFiles||[]; S.npFiles=[];
  S.open=null; S.view='projects'; render();
  toast('Project "'+name+'" created'+(files.length?'. Uploading '+files.length+' document(s).':'.'));
  files.forEach(f=>addDocFile(f,id));
}

function suggestLead(pid,nid){
  if(!can('suggestLead')) return toast('Your role cannot suggest a project lead.');

  S.leadReqs.push({id:'r'+(++S.seq),project:pid,nominee:nid,by:S.user,status:'pending',at:Date.now()});

  toast('Suggestion sent. A Founder or Super Admin needs to approve it.'); render();

function decideLead(rid,ok){
  if(!can('approveLead')) return toast('Only a Founder or Super Admin can decide this.');
  const r=S.leadReqs.find(x=>x.id===rid); if(!r||r.status!=='pending') return;
  r.status=ok?'approved':'rejected'; r.decidedBy=S.user; const p=PR(r.project), n=P(r.nominee);
  if(ok){ p.lead=r.nominee; if(!['super_admin','founder'].includes(n.rk)&&!n.acc.includes(p.id)) n.acc.push(p.id); }
  audit((ok?'Approved ':'Rejected ')+n.name+' as lead of '+p.name);
  sysMsg(p.id,ok?n.name+' is now the project lead.':'The suggestion of '+n.name+' as project lead was not approved.');
  toast(ok?n.name+' is now lead of '+p.name+'.':'Suggestion rejected.'); render();
}

function parseHours(v){ if(v==null||v==='') return 0; if(typeof v==='number') return v; const s=String(v).trim().toLowerCase(); let h=0; const hm=s.match(/([\d.]+)\s*h/), mm=s.match(/([\d.]+)\s*m/), cm=s.match(/^(\d+):(\d+)$/); if(hm||mm){ if(hm) h+=parseFloat(hm[1]); if(mm) h+=parseFloat(mm[1])/60; } else if(cm) h=parseInt(cm[1],10)+parseInt(cm[2],10)/60; else if(!isNaN(parseFloat(s))) h=parseFloat(s); return Math.round(h*100)/100; }
const r2 = n => Math.round(n*100)/100;

  const ratio=n?completed/n:1, br=n?blockedN/n:0;

}
function contributorDash(logs){
  const by={};
  logs.forEach(l=>{ const k=l.employee.name; const c=by[k]||(by[k]={contributor:k,department:l.employee.department,role:l.employee.role,total:0,done:0,pending:0,blocked:0,hours:0,ps:0,pc:0,ach:[],bot:[],sup:[]});
    (l.tasks||[]).forEach(t=>{ c.total++; if(t.status==='Completed')c.done++; if(t.status==='Not Started')c.pending++; if(t.blocked)c.blocked++; c.hours+=parseHours(t.actualTime); c.ps+=Number(t.percentComplete)||0; c.pc++; });
    if(l.wins)c.ach.push(l.wins); if(l.challenges&&l.challenges.slowedDown)c.bot.push(l.challenges.slowedDown); if(l.challenges&&l.challenges.needsSupport)c.sup.push(l.challenges.needsSupport); });
  return Object.values(by).map(c=>({contributor:c.contributor,department:c.department,role:c.role,totalTasks:c.total,completed:c.done,pending:c.pending,blocked:c.blocked,hoursWorked:r2(c.hours),productivityScore:c.pc?Math.round(c.ps/c.pc):0,majorAchievement:c.ach.slice(-1)[0]||'—',currentBottleneck:c.bot.slice(-1)[0]||'—',supportNeeded:c.sup.slice(-1)[0]||'—'}));
}
function dependencyDash(logs){

  const od=openDeps(t), run=Object.values(S.active).some(a=>a.task===t.id);
  return `<button class="tcard ${blocked(t)?'blocked':''} ${t.status==='doing'?'doing':''}" data-act="open" data-id="${t.id}">
    <b>${esc(t.title)}</b>
    <div class="meta">${prioChip(t.priority)}${projChip(t.project)}${t.due?`<span>Due ${esc(t.due.slice(5))}</span>`:''}${run?'<span class="chip acc">Timer running</span>':''}</div>
    <div class="meta">${av(t.who)}<span>${esc(P(t.who).name.split(' ')[0])}</span><span class="mono">${h(taskMin(t.id))} / ${t.est}h</span>${t.deps.length?`<span title="Depends on ${t.deps.length}">⛓ ${t.deps.length}</span>`:''}</div>
    ${od.length?`<div class="meta" style="color:var(--bad)">Waiting on ${esc(od[0].title)}${od.length>1?' +'+(od.length-1):''}</div>`:''}
  </button>`;
}

views.time = () => {
  const me=P(S.user), E=allEntries();
  let mine='';
  if (me.member){
    const a=S.active[me.id], todays=E.filter(e=>e.person===me.id).sort((x,y)=>y.start-x.start).slice(0,8);
    const todo=S.tasks.filter(t=>t.who===me.id && t.status!=='done').sort((a,b)=>PRIO[a.priority].o-PRIO[b.priority].o);
    mine=`<div class="grid g2">
      <div class="card"><h2>${esc(me.name)}: timer</h2>
        ${a?`<div class="mono" style="font-size:36px" data-elapsed="${me.id}">${clock(Date.now()-a.start)}</div><p><b>${esc(T(a.task).title)}</b><br><span class="muted">Started ${tm(a.start)}. Ends automatically when you mark it done or start another task.</span></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn start pause" data-act="stop">Pause timer</button><button class="btn pri" style="min-height:40px;padding:10px 18px;font-size:13.5px" data-act="done" data-id="${a.task}">Mark done</button></div>`
        :'<p class="muted">No timer running. Pick a task to start it; the start time is saved for you.</p><button class="btn pri start" data-act="quickstart">Start timer</button>'}
      </div>
      <div class="card"><h2>My tasks <small>${todo.length} open</small></h2><div class="list">${todo.map(t=>`<div class="li"><div class="grow"><div>${esc(t.title)}</div><div class="muted">${blocked(t)?'Blocked by '+esc(openDeps(t)[0].title):h(taskMin(t.id))+' of '+t.est+'h'}</div></div>${blocked(t)?'<span class="chip bad">Blocked</span>':`<button class="btn start ${a&&a.task===t.id?'':'pri'}" data-act="start" data-id="${t.id}" ${a&&a.task===t.id?'disabled':''}>${a&&a.task===t.id?'Running':'Start'}</button>`}</div>`).join('') || '<p class="muted">No open tasks.</p>'}</div></div>
    </div>
    <div class="card" style="margin-top:16px"><h2>My recent time entries</h2><div class="tablewrap"><table><thead><tr><th>Day</th><th>Task</th><th>Start</th><th>End</th><th class="r">Duration</th></tr></thead><tbody>
      ${todays.map(e=>`<tr><td>${dayLbl(e.start)}</td><td>${esc(T(e.task).title)}</td><td>${tm(e.start)}</td><td>${e.live?'<span class="chip acc">running</span>':tm(e.end)}</td><td class="r">${h(emin(e))}</td></tr>`).join('')}</tbody></table></div></div>`;
  } else mine=`<div class="card"><h2>Founder view</h2><p class="muted">Time tracking belongs to team members. ${LIVE?'Read the team timesheet below.':'Use "Viewing as" in the top bar to try a timer, or read the team timesheet below.'}</p></div>`;
  return mine + `<div class="card" style="margin-top:16px"><h2>Team timesheet <small>hours per day, week of ${weekOf()}</small></h2><div class="tablewrap"><table><thead><tr><th>Member</th>${[0,1,2,3,4].map(i=>`<th class="r">${dayName(i)}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
    ${members().map(m=>{ const row=[0,1,2,3,4].map(i=>E.filter(e=>e.person===m.id&&Math.floor((e.start-WEEK0)/DAY)===i).reduce((a,e)=>a+emin(e),0)); return `<tr><td>${esc(m.name)}</td>${row.map(v=>`<td class="r">${v?h(v):'–'}</td>`).join('')}<td class="r"><b>${h(row.reduce((a,b)=>a+b,0))}</b></td></tr>`; }).join('')}</tbody></table></div></div>`;
};

views.projects = () => {
  const E=allEntries();
  const head=`<div class="toolbar"><span class="muted">${visProjects().length} project${visProjects().length===1?'':'s'}</span>${can('addProject')?'<button class="btn pri sp" data-act="newproject">New project</button>':''}</div>`;
  if(!visProjects().length) return head+'<div class="card"><p class="muted" style="margin:0">You do not have access to any project yet.</p></div>';
  return head+`<div class="grid">${visProjects().map(p=>{
    const ts=S.tasks.filter(t=>t.project===p.id), done=ts.filter(t=>t.status==='done').length, est=ts.reduce((a,t)=>a+t.est,0);
    const by=members().map(m=>({m,min:E.filter(e=>e.person===m.id&&T(e.task).project===p.id).reduce((a,e)=>a+emin(e),0)})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min);
    const sum=by.reduce((a,x)=>a+x.min,0)||1;
    const pd=S.docs.filter(d=>d.project===p.id);
    return `<div class="card"><h2><span>${esc(p.name)}</span><small>${done} of ${ts.length} tasks done · ${(sum===1?0:sum/60).toFixed(1)}h logged · ${est}h estimated</small></h2>
      ${p.desc?`<p class="muted" style="margin:-4px 0 12px">${esc(p.desc)}</p>`:''}
      ${leadRow(p)}
      <div class="meta" style="margin-bottom:12px"><b style="color:var(--ink)">Documents (${pd.length})</b>${pd.slice(0,4).map(d=>`<button class="chip acc" style="border:0;cursor:pointer" data-act="gotodoc" data-id="${d.id}">${esc(d.name)}</button>`).join('')}${can('uploadDoc')?`<label class="btn sm" for="up-${p.id}" style="cursor:pointer">Upload document</label><input id="up-${p.id}" data-up="${p.id}" type="file" multiple hidden>`:''}</div>
      <div class="bar" style="height:14px">${by.map(x=>`<span title="${esc(x.m.name)} ${h(x.min)}" style="width:${x.min/sum*100}%;background:${x.m.c}"></span>`).join('')}</div>
      <div class="legend">${by.map(x=>`<span><i class="dot" style="display:inline-block;background:${x.m.c};margin-right:6px"></i>${esc(x.m.name)} ${h(x.min)}</span>`).join('') || 'No time logged yet'}</div>
      <div class="list" style="margin-top:10px">${ts.length?'':'<p class="muted" style="margin:0">No tasks yet. Add one from the Tasks screen.</p>'}${ts.map(t=>`<div class="li">${av(t.who)}<div class="grow"><div>${esc(t.title)}</div></div><span class="muted mono">${h(taskMin(t.id))} / ${t.est}h</span>${prioChip(t.priority)}${statusChip(t)}<button class="btn sm" data-act="open" data-id="${t.id}">Open</button></div>`).join('')}</div></div>`;
  }).join('')}</div>`;
};

function filteredDocs(){ return S.docs.filter(d => visIds().includes(d.project) && (S.docProj==='all'||d.project===S.docProj) &&d.name.toLowerCase().includes(S.docQ.toLowerCase())); }
function docList(){ return filteredDocs().map(d=>`<button class="docrow" data-act="doc" data-id="${d.id}" aria-current="${S.docSel===d.id}"><span class="ext">${esc(d.type.slice(0,4).toUpperCase())}</span><span><b>${esc(d.name)}</b><br><span class="muted">${esc(PR(d.project).name)} · ${esc(P(d.owner).name.split(' ')[0])} · ${esc(d.upd)}</span></span></button>`).join('') || '<p class="muted" style="padding:8px">No documents match.</p>'; }
function docPreview(){
  const d=S.docs.find(x=>x.id===S.docSel); if(!d) return '<div class="paper muted">Select a document to preview it.</div>';
  const blocks=d.body.split('\n\n').map(b=> b.startsWith('- ') ? '<ul>'+b.split('\n').map(l=>'<li>'+esc(l.slice(2))+'</li>').join('')+'</ul>' : '<p>'+esc(b)+'</p>').join('');
  return `<div class="paper"><div class="meta">${projChip(d.project)}<span class="chip">${esc(d.type)}</span></div><h2 style="margin-top:10px">${esc(d.name)}</h2><div class="muted">Owner ${esc(P(d.owner).name)} · updated ${esc(d.upd)}</div>${LIVE&&d.path?`<p><button class="btn sm" data-act="opendoc" data-id="${d.id}">Open file</button></p>`:''}${blocks}</div>`;
}
views.docs = () => `<div class="toolbar"><input type="search" id="docQ" placeholder="Search documents" value="${esc(S.docQ)}" aria-label="Search documents">
  <select id="docProj" aria-label="Project"><option value="all">All projects</option>${visProjects().map(p=>`<option value="${p.id}" ${S.docProj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
  ${can('uploadDoc')?'<label class="btn pri sp" for="upload" style="cursor:pointer">Upload document</label><input id="upload" type="file" accept=".txt,.md,.csv,.pdf,.docx" hidden>':'<span class="sp muted">Your role cannot upload documents.</span>'}</div>
  <div class="docs"><div class="card" style="padding:8px"><div id="doclist">${docList()}</div></div><div id="docprev">${docPreview()}</div></div>
  <p class="note">${LIVE?'One shared library for every project. Text, Markdown and CSV files preview here; use Open file for everything else.':'One shared library for every project. Text and Markdown files preview here; other types are stored with a placeholder in this prototype.'}</p>`;

function weekStats(){
  const E=weekEntries();
  const perDay=[0,1,2,3,4].map(i=>projects.map(p=>E.filter(e=>Math.floor((e.start-WEEK0)/DAY)===i&&T(e.task).project===p.id).reduce((a,e)=>a+emin(e),0)));
  return {E, perDay, total:E.reduce((a,e)=>a+emin(e),0)};
}
function reportText(){
  const {E,total}=weekStats(), bl=S.tasks.filter(blocked);
  return ['GoXL weekly report, week of '+weekOf()+' '+new Date(WEEK0).getFullYear(),'',
   `Hours logged: ${h(total)}   Tasks done: ${S.tasks.filter(t=>t.status==='done').length}/${S.tasks.length}   Blocked: ${bl.length}`,'','By project:',
   ...projects.map(p=>`- ${p.name}: ${h(E.filter(e=>T(e.task).project===p.id).reduce((a,e)=>a+emin(e),0))}`),'','By member:',
   ...members().map(m=>`- ${m.name}: ${h(E.filter(e=>e.person===m.id).reduce((a,e)=>a+emin(e),0))}`),'','Blocked:',
   ...(bl.length?bl.map(t=>`- ${t.title} (waiting on ${openDeps(t).map(d=>d.title).join(', ')})`):['- none'])].join('\n');
}
views.reports = () => {
  if(!can('viewReports')) return '<div class="card"><h2>No access</h2><p class="muted" style="margin:0">Your role cannot view reports. Ask a Super Admin to change this.</p></div>';
  const {E,perDay,total}=weekStats();
  const tabs=`<div class="toolbar"><div style="display:flex;gap:6px"><button class="btn ${S.reportTab==='weekly'?'pri':''}" data-act="rtab" data-id="weekly">Weekly report</button><button class="btn ${S.reportTab==='team'?'pri':''}" data-act="rtab" data-id="team">Team report</button></div><button class="btn sp" data-act="copyreport">Copy report text</button></div>`;
  if (S.reportTab==='team'){
    return tabs+`<div class="grid g3">${members().map(m=>{
      const min=E.filter(e=>e.person===m.id).reduce((a,e)=>a+emin(e),0), done=S.tasks.filter(t=>t.who===m.id&&t.status==='done').length, open=S.tasks.filter(t=>t.who===m.id&&t.status!=='done').length;
      const a=S.active[m.id], util=Math.round(min/60/m.cap*100);
      return `<div class="card"><div class="li" style="border:0;padding-top:0">${av(m.id)}<div class="grow"><b>${esc(m.name)}</b><div class="muted">${esc(m.role)}</div></div></div>
        <div class="kpi"><b>${h(min)}</b><span>${m.cap}h weekly capacity · ${util}% used so far</span></div>
        <div class="bar" style="margin:10px 0"><span style="width:${Math.min(100,util)}%;background:${m.c}"></span></div>
        <div class="meta"><span>${done} done</span><span>${open} open</span></div>
        <p class="muted" style="margin:8px 0 0">${a?'Now: '+esc(T(a.task).title):'Not tracking right now'}</p></div>`;
    }).join('')}</div>`;
  }
  const max=Math.max(1,...perDay.map(d=>d.reduce((a,b)=>a+b,0)/60));
  return tabs+`<div class="grid g4">
    <div class="card kpi"><b>${h(total)}</b><span>Hours logged</span></div>
    <div class="card kpi"><b>${S.tasks.filter(t=>t.status==='done').length}</b><span>Tasks completed</span></div>
    <div class="card kpi"><b>${S.tasks.filter(t=>t.status==='doing').length}</b><span>In progress</span></div>
    <div class="card kpi ${S.tasks.some(blocked)?'bad':''}"><b>${S.tasks.filter(blocked).length}</b><span>Blocked</span></div></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Hours per day by project <small>Mon to Fri, ${weekRange()}</small></h2>
      <div class="chart">${perDay.map(d=>{ const tot=d.reduce((a,b)=>a+b,0)/60; return `<div class="d"><span class="v">${tot?tot.toFixed(1):''}</span><div class="stack" style="height:${tot/max*150}px">${d.map((v,i)=>`<span style="height:${tot?v/60/tot*100:0}%;background:${projects[i].c}" title="${esc(projects[i].name)} ${h(v)}"></span>`).join('')}</div></div>`; }).join('')}</div>
      <div class="xl">${[0,1,2,3,4].map(i=>`<span>${dayName(i)}</span>`).join('')}</div>
      <div class="legend">${projects.map(p=>`<span><i class="dot" style="display:inline-block;background:${p.c};margin-right:6px"></i>${esc(p.name)}</span>`).join('')}</div></div>
    <div class="card"><h2>Hours by member</h2><div class="list">${members().map(m=>{ const min=E.filter(e=>e.person===m.id).reduce((a,e)=>a+emin(e),0); return `<div class="li">${av(m.id)}<div class="grow"><div style="display:flex;justify-content:space-between"><span>${esc(m.name)}</span><span class="mono">${h(min)}</span></div><div class="bar" style="margin-top:5px"><span style="width:${Math.min(100,min/60/m.cap*100)}%;background:${m.c}"></span></div></div></div>`; }).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Needs attention</h2>${S.tasks.filter(blocked).map(t=>`<div class="li"><div class="grow"><b>${esc(t.title)}</b><div class="muted">${esc(P(t.who).name)} is waiting on ${openDeps(t).map(d=>esc(d.title)+' ('+esc(P(d.who).name.split(' ')[0])+')').join(', ')}</div></div></div>`).join('') || '<p class="muted">No blocked tasks.</p>'}</div>`;
};

}

const NAV=[['dashboard','Overview'],['tasks','Tasks'],['time','Time'],['projects','Projects'],['log','Daily log'],['founder','Founder dashboard'],['docs','Docs'],['reports','Reports'],['chat','Team chat'],['admin','Admin']];
const TITLE={dashboard:'Team overview',tasks:'Task board',time:'Time tracking',projects:'Project contribution',docs:'Document manager',reports:'Reports',chat:'Team chat',admin:'Super admin panel',log:'Daily log',founder:'Founder dashboard'};
function renderSide(){
  const me=P(S.user), bl=S.tasks.filter(blocked).length;
  $('#side').innerHTML=`<div class="brand"><img src="${LOGO}" width="112" height="36" alt="GoXL"><span>Team Hub</span></div>`
   + NAV.filter(navOk).map(([id,n])=>`<button class="nav" data-act="nav" data-id="${id}" ${S.view===id?'aria-current="page"':''}><span>${n}</span>${id==='tasks'&&bl?`<span class="n">${bl}</span>`:''}</button>`).join('')
   + `<div class="me"><div class="row">${av(me.id)}<div><b>${esc(me.name)}</b><small>${esc(me.role)}<br><b>${ROLES[me.rk]}</b></small></div></div><small>Signed in. Stays signed in on this device.</small><button class="btn sm" data-act="signout">Sign out</button></div>`;
}
function renderTop(){
  const a=S.active[S.user];
  const mineOpen=S.tasks.filter(t=>t.who===S.user&&t.status!=='done').length;
  $('#top').innerHTML=`<h1>${TITLE[S.view]}</h1>${a?`<span class="pill run"><span class="dot"></span>${esc(T(a.task).title)} <b class="mono" data-elapsed="${S.user}">${clock(Date.now()-a.start)}</b></span><button class="btn start pause" data-act="stop">Pause</button>`:(P(S.user).member||mineOpen?'<button class="btn pri start" data-act="quickstart">Start timer</button>':'')}
   ${LIVE?'':`<label>Viewing as <select id="who">${people.filter(p=>p.on).map(p=>`<option value="${p.id}" ${p.id===S.user?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`}`;
}
function renderDrawer(){
  const o=$('#overlay'); if(S.open===null){ o.innerHTML=''; return; }
  if (S.open==='sheet'){ o.innerHTML=sheetHTML(); return; }
  if (S.open==='quickstart'){
    const list=S.tasks.filter(t=>t.who===S.user&&t.status!=='done').sort((a,b)=>(blocked(a)-blocked(b))||(PRIO[a.priority].o-PRIO[b.priority].o));
    o.innerHTML=`<div class="shade" data-act="close"><div class="drawer"><div style="display:flex;justify-content:space-between;gap:12px"><h2>Start a timer</h2><button class="btn sm" data-act="close">Close</button></div>
      <p class="muted" style="margin:0">Pick the task you are working on. Your previous timer, if any, stops by itself.</p>
      <div class="list">${list.map(t=>`<div class="li"><div class="grow"><div><b>${esc(t.title)}</b></div><div class="meta" style="margin-top:4px">${prioChip(t.priority)}${projChip(t.project)}<span>${blocked(t)?'Waiting on '+esc(openDeps(t)[0].title):h(taskMin(t.id))+' of '+t.est+'h'}</span></div></div>${blocked(t)?'<span class="chip bad">Blocked</span>':`<button class="btn pri start" data-act="start" data-id="${t.id}">Start</button>`}</div>`).join('')||`<p class="muted" style="margin:0">A timer runs on a task assigned to you, and you have none open. ${can('addTask')?(visProjects().length?'Create a task and assign it to yourself, then start it here.':'Create a project first, then add a task for yourself.'):'Ask your Project Manager or Lead to assign you a task.'}</p>${can('addTask')?`<div style="display:flex;gap:8px">${visProjects().length?'<button class="btn pri" data-act="newtask">New task</button>':(can('addProject')?'<button class="btn pri" data-act="gonewproject">Create a project</button>':'')}</div>`:''}`}</div></div></div>`;
    return;
  }
  if (S.open==='newproject'){
    o.innerHTML=`<div class="shade" data-act="close"><div class="drawer"><div style="display:flex;justify-content:space-between;gap:12px"><h2>New project</h2><button class="btn sm" data-act="close">Close</button></div>
      <label class="field">Project name<input type="text" id="npName" placeholder="For example, Client portal"></label>
      <label class="field">What is it? (optional)<input type="text" id="npDesc" placeholder="One line"></label>
      <div class="field">Documents (optional)<label class="btn" for="npFiles" style="cursor:pointer;align-self:flex-start">Choose files</label><input id="npFiles" type="file" multiple hidden><span id="npFileList" style="font-weight:400">No files chosen</span></div>
      <button class="btn pri" data-act="createproject" style="align-self:flex-start">Create project</button>
      <p class="muted" style="margin:0">You get access to the new project. Add tasks from the Tasks screen and give teammates access in Admin.</p></div></div>`;
    setTimeout(()=>{const x=$('#npName'); x&&x.focus();},0); return;
  }
  if (S.open==='new' && !visProjects().length){
    o.innerHTML=`<div class="shade" data-act="close"><div class="drawer"><h2>New task</h2>
      <p class="muted">Every task belongs to a project, and you do not have one yet. ${can('addProject')?'Create a project first, then add tasks to it.':'Ask a Super Admin to give you access to a project.'}</p>
      <div style="display:flex;gap:8px">${can('addProject')?'<button class="btn pri" type="button" data-act="gonewproject">Create a project</button>':''}<button class="btn" type="button" data-act="close">Close</button></div></div></div>`;
    return;
  }
  if (S.open==='new'){
    o.innerHTML=`<div class="shade" data-act="close"><form class="drawer" id="newform"><h2>New task</h2>
      <label class="field">Title<input type="text" id="nt" required placeholder="What needs doing?"></label>
      <div class="row2"><label class="field">Project<select id="np">${visProjects().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
      <label class="field">Assignee<select id="nw">${assignable((visProjects()[0]||{}).id).map(m=>`<option value="${m.id}" ${m.id===S.user?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label></div>
      <div class="row2"><label class="field">Estimate (hours)<input type="number" id="ne" min="0.5" step="0.5" value="4"></label>
      <label class="field">Priority<select id="npr">${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${k==='medium'?'selected':''}>${v.n}</option>`).join('')}</select></label></div>
      <label class="field">Due date (optional)<input type="date" id="nd"></label>
      <div style="display:flex;gap:8px"><button class="btn pri" type="submit">Create task</button><button class="btn" type="button" data-act="close">Cancel</button></div>
      <p class="muted">Add dependencies after creating the task.</p></form></div>`;
    setTimeout(()=>{const x=$('#nt'); x&&x.focus();},0); return;
  }
  const t=T(S.open), dependents=S.tasks.filter(x=>x.deps.includes(t.id)), mine=S.active[S.user]&&S.active[S.user].task===t.id;
  const cands=S.tasks.filter(x=>x.id!==t.id && !t.deps.includes(x.id) && !reaches(x.id,t.id));
  const ents=allEntries().filter(e=>e.task===t.id).sort((a,b)=>b.start-a.start).slice(0,6);
  o.innerHTML=`<div class="shade" data-act="close"><div class="drawer">
    <div style="display:flex;justify-content:space-between;gap:12px"><div><div class="meta">${projChip(t.project)} ${statusChip(t)}</div><h2 style="margin-top:8px">${esc(t.title)}</h2></div><button class="btn sm" data-act="close" aria-label="Close">Close</button></div>
    <div class="row2"><label class="field">Priority${can('setPriority')?`<select id="prioSel">${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${t.priority===k?'selected':''}>${v.n}</option>`).join('')}</select>`:`<span>${prioChip(t.priority)}</span>`}</label>
      <label class="field">Due date<input type="date" id="dueSel" value="${esc(t.due||'')}" ${can('setPriority')?'':'disabled'}></label></div>
    <div class="row2"><label class="field">Assignee<select id="assign" ${can('reassign')?'':'disabled'}>${LIVE&&!t.who?'<option value="" selected>Unassigned</option>':''}${(LIVE?assignable(t.project).concat(people.filter(m=>m.id===t.who&&!assignable(t.project).includes(m))):activeMembers().concat(members().filter(m=>!m.on&&m.id===t.who))).map(m=>`<option value="${m.id}" ${m.id===t.who?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
      <div class="field">Time logged<b class="mono" style="font-size:18px;color:var(--ink)">${h(taskMin(t.id))} <span class="muted" style="font-size:12px">of ${t.est}h</span></b></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${t.status!=='done'?`<button class="btn pri start" data-act="start" data-id="${t.id}" ${mine?'disabled':''}>${mine?'Timer running':'Start my timer'}</button><button class="btn" style="min-height:40px;padding:10px 16px" data-act="done" data-id="${t.id}">Mark done</button>`:'<span class="chip good">Completed</span>'}
    </div>
    <div class="sec"><h3>Depends on</h3>${t.deps.length?t.deps.map(id=>{const d=T(id);return `<div class="li">${av(d.who)}<div class="grow"><div>${esc(d.title)}</div><div class="muted">${esc(P(d.who).name)}</div></div>${statusChip(d)}<button class="btn sm danger" data-act="rmdep" data-id="${d.id}" aria-label="Remove dependency">Remove</button></div>`;}).join(''):'<p class="muted" style="margin:0">No dependencies.</p>'}
      <div style="display:flex;gap:8px"><select id="depSel" style="flex:1" aria-label="Add dependency"><option value="">Add a task this one waits on…</option>${cands.map(x=>`<option value="${x.id}">${esc(x.title)} (${esc(P(x.who).name.split(' ')[0])})</option>`).join('')}</select><button class="btn" data-act="adddep">Add</button></div></div>
    <div class="sec"><h3>Unblocks</h3>${dependents.length?dependents.map(d=>`<div class="li">${av(d.who)}<div class="grow">${esc(d.title)}</div>${statusChip(d)}</div>`).join(''):'<p class="muted" style="margin:0">Nothing waits on this task.</p>'}</div>
    <div class="sec"><h3>Time entries</h3>${ents.length?ents.map(e=>`<div class="li">${av(e.person)}<div class="grow">${dayLbl(e.start)} ${tm(e.start)} to ${e.live?'now':tm(e.end)}</div><span class="mono">${h(emin(e))}</span></div>`).join(''):'<p class="muted" style="margin:0">No time logged yet.</p>'}</div>
  </div></div>`;
}
function render(){ if(!navOk([S.view])) S.view='dashboard'; if(!visChannels().some(c=>c[0]===S.channel)) S.channel='general'; renderSide(); renderTop(); const m=$('#main'); m.innerHTML=views[S.view](); renderDrawer(); if(S.view==='chat'){const b=$('#msgs'); b&&(b.scrollTop=b.scrollHeight);} }

/* ---------- Sign-in (session is remembered when storage is available) ---------- */
function showSignin(){
  $('#overlay').innerHTML=`<div class="signin"><div class="card"><h2>Sign in to GoXL Team Hub</h2><p class="muted" style="margin:0">Choose who you are. In the real platform this is email sign-in; the session stays active until you sign out.</p>
   ${people.filter(p=>p.on).map(p=>`<button class="who" data-act="login" data-id="${p.id}">${av(p.id)}<span><b>${esc(p.name)}</b><br><span class="muted">${esc(p.role)}</span></span></button>`).join('')}
   <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="keep" checked> Keep me signed in</label></div></div>`;
}
try{ const u=localStorage.getItem('goxl_user'); if(u && people.some(p=>p.id===u)) S.user=u; }catch(e){}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='close'){ if(e.target!==el && el.classList.contains('shade')) return; S.open=null; renderDrawer(); }
  else if(a==='nav'){ S.view=id; S.open=null; render(); }
  else if(a==='open'){ S.open=id; renderDrawer(); }
  else if(a==='newtask'){ if(!can('addTask')) return toast('Your role cannot add tasks.'); S.open='new'; renderDrawer(); }
  else if(a==='newproject'){ if(!can('addProject')) return toast('Your role cannot create projects.'); S.open='newproject'; S.npFiles=[]; renderDrawer(); }
  else if(a==='gonewproject'){ if(!can('addProject')) return toast('Your role cannot create projects.'); S.view='projects'; S.open='newproject'; S.npFiles=[]; render(); }
  else if(a==='createproject'){ createProject(); }
  else if(a==='leadsuggest'){ const v=$('#lead-'+id).value; if(!v) return toast('Choose someone to suggest.'); suggestLead(id,v); }
  else if(a==='leadok'){ decideLead(id,true); }
  else if(a==='leadno'){ decideLead(id,false); }
  else if(a==='gotodoc'){ S.docSel=id; S.docProj='all'; S.docQ=''; S.view='docs'; S.open=null; render(); }
  else if(a==='sheet'){ if(!can('uploadSheet')) return toast('Your role cannot upload task sheets.'); S.open='sheet'; renderDrawer(); }
  else if(a==='sheetexample'){ S.sheetText=SHEET_EX; S.sheetRows=null; renderDrawer(); }
  else if(a==='sheetparse'){ S.sheetText=$('#sheetText').value; S.sheetRows=checkSheet(S.sheetText); renderDrawer(); }
  else if(a==='sheetimport'){ importSheet(); }
  else if(a==='sheetcopy'){ try{ navigator.clipboard.writeText(SHEET_HEAD+'\n').then(()=>toast('Header row copied.'),()=>toast('Copy was blocked here.')); }catch(err){ toast('Copy was blocked here.'); } }
  else if(a==='toggleon'){ toggleOn(id); }
  else if(a==='addlogtask'){ draft().tasks.push(blankTask()); render(); }
  else if(a==='rmlogtask'){ const d=draft(); d.tasks.splice(+id,1); if(!d.tasks.length) d.tasks.push(blankTask()); render(); }
  else if(a==='addnt'){ draft().newTasksForOthers.push(blankNT()); render(); }
  else if(a==='rmnt'){ draft().newTasksForOthers.splice(+id,1); render(); }
  else if(a==='logfill'){ fillFromTimer(); }
  else if(a==='logsubmit'){ submitLog(); }
  else if(a==='logblank'){ S.drafts[S.user]=blankDraft(); toast('Started a blank log.'); render(); }
  else if(a==='execsum'){ const r=logRange(); const logs=S.logs.filter(l=>l.employee.date>=r.from&&l.employee.date<=r.to); S.exec=localSummary(buildDash(logs),logs); render(); const c=$('#execcard'); if(c&&c.scrollIntoView) c.scrollIntoView({block:'start'}); }
  else if(a==='invite'){ invite(); }
  else if(a==='quickstart'){ S.open='quickstart'; renderDrawer(); }
  else if(a==='start'){ if(S.open==='quickstart') S.open=null; startTimer(S.user,id); }
  else if(a==='stop'){ pauseTimer(); }
  else if(a==='done'){ markDone(id); }
  else if(a==='adddep'){ addDep(S.open,$('#depSel').value); }
  else if(a==='rmdep'){ removeDep(S.open,id); }
  else if(a==='doc'){ S.docSel=id; $('#doclist').innerHTML=docList(); $('#docprev').innerHTML=docPreview(); }
  else if(a==='rtab'){ S.reportTab=id; render(); }
  else if(a==='chan'){ S.channel=id; render(); }
  else if(a==='send'){ sendMsg(); }
  else if(a==='copyreport'){ const txt=reportText(); try{ navigator.clipboard.writeText(txt).then(()=>toast('Report copied.'),()=>toast('Copy was blocked here.')); }catch(err){ toast('Copy was blocked here.'); } }
  else if(a==='signout'){ signOut(); }
  else if(a==='opendoc'){ openDoc(id); }
  else if(a==='login'){ S.user=id; try{ if($('#keep').checked) localStorage.setItem('goxl_user',id); }catch(e){} $('#overlay').innerHTML=''; render(); }
});
document.addEventListener('change', e=>{
  const id=e.target.id, d=e.target.dataset;
  if(d.up){ [...e.target.files].forEach(f=>addDocFile(f,d.up)); e.target.value=''; return; }
  if(d.role){ setRole(d.role,e.target.value); return; }
  if(d.acc){ const [pid,pr]=d.acc.split(':'); setAccess(pid,pr,e.target.checked); return; }
  if(d.perm){ const [r,k]=d.perm.split(':'); setPerm(r,k,e.target.checked); return; }
  if(id==='prioSel'){ if(!can('setPriority')) return; setPriority(S.open,e.target.value); return; }
  if(id==='dueSel'){ if(!can('setPriority')) return; setDue(S.open,e.target.value); return; }
  if(id==='np'){ const s=$('#nw'); if(s) s.innerHTML=assignable(e.target.value).map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join(''); return; }
  if(id==='fPrio'){ S.fPrio=e.target.value; render(); return; }
  if(id==='sheetfile'){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ S.sheetText=String(r.result); S.sheetRows=checkSheet(S.sheetText); renderDrawer(); }; r.readAsText(f); return; }
  if(id==='who'){ S.user=e.target.value; try{localStorage.setItem('goxl_user',S.user);}catch(x){} render(); }
  else if(id==='fPerson'){ S.fPerson=e.target.value; render(); }
  else if(id==='fProject'){ S.fProject=e.target.value; render(); }
  else if(id==='docProj'){ S.docProj=e.target.value; $('#doclist').innerHTML=docList(); }
  else if(id==='assign'){ assignTask(S.open,e.target.value); }
  else if(id==='upload'){
    [...e.target.files].forEach(f=>addDocFile(f,S.docProj==='all'?visIds()[0]:S.docProj)); e.target.value='';
  }
  else if(id==='npFiles'){
    S.npFiles=[...e.target.files]; const el=$('#npFileList'); if(el) el.textContent=S.npFiles.length?S.npFiles.map(f=>f.name).join(', '):'No files chosen';
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='docQ'){ S.docQ=e.target.value; $('#doclist').innerHTML=docList(); }
  const f=e.target.dataset&&e.target.dataset.f; if(f) setPath(draft(),f,e.target.type==='checkbox'?e.target.checked:e.target.value);
});
document.addEventListener('change', e=>{
  const f=e.target.dataset&&e.target.dataset.f;
  if(f&&/\.blocked$/.test(f)){ setPath(draft(),f,e.target.checked); const m=$('#main'), st=m.scrollTop; m.innerHTML=views.log(); m.scrollTop=st; }
  if(e.target.id==='frange'){ S.fRange=e.target.value; S.exec=null; render(); }
});
document.addEventListener('keydown', e=>{ if(e.target.id==='npName'&&e.key==='Enter'){ e.preventDefault(); createProject(); return; } if(e.target.id==='msgIn' && e.key==='Enter'){ e.preventDefault(); sendMsg(); } if(e.key==='Escape' && S.open!==null){ S.open=null; renderDrawer(); } });
document.addEventListener('submit', e=>{
  if(e.target.id==='newform'){ e.preventDefault();
    const title=$('#nt').value.trim(); if(!title) return;
    if(!can('addTask')) return toast('Your role cannot add tasks.');
    createTask({title,project:$('#np').value,who:$('#nw').value,est:parseFloat($('#ne').value)||4,priority:$('#npr').value,due:$('#nd').value}); }
});
function sendMsg(){
  const i=$('#msgIn'); const x=i.value.trim(); if(!x) return;
  S.msgs.push({ch:S.channel,who:S.user,t:tm(Date.now()),x}); i.value='';
  const b=$('#msgs'); b.innerHTML=msgList(); b.scrollTop=b.scrollHeight;
}
setInterval(()=>{ document.querySelectorAll('[data-elapsed]').forEach(el=>{ const a=S.active[el.dataset.elapsed]; if(a) el.textContent=clock(Date.now()-a.start); }); },1000);
if(!LIVE) render();   // LIVE: team/backend.js signs the person in, loads their data, then renders
</script>
<script src="/team/vendor/supabase-2.119.2.js"></script>
<script src="/team/backend.js"></script>
</body>
